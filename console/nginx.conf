server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /console-health { add_header Content-Type text/plain; return 200 'ok'; }
  location /v1/ { proxy_pass http://gateway:8000; proxy_set_header X-Request-ID $http_x_request_id; }
  location /admin/ { proxy_pass http://gateway:8000; }
  location /providers/ { proxy_pass http://gateway:8000; }
  location /meta/ { proxy_pass http://gateway:8000; }
  location /dev/ { proxy_pass http://gateway:8000; proxy_set_header X-Dev-Control-Token $http_x_dev_control_token; }
  location = /ready { proxy_pass http://gateway:8000; }
  location = /health { proxy_pass http://gateway:8000; }
  location = /metrics { proxy_pass http://gateway:8000; }
  location /grafana/ { proxy_pass http://grafana:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
